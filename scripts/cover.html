<!--
  Source of cover.jpg, the catalog cover (Gladys store rule: JPEG or PNG,
  exactly 800x534 px, 150 KB max). To regenerate it, render with a headless
  Chromium on a window TALLER than the cover (headless keeps part of the
  window for its own UI) without scrollbars, then crop and encode as JPEG:

    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=800,800 --screenshot=raw.png "file://$PWD/scripts/cover.html"
    python3 -c "from PIL import Image; Image.open('raw.png').convert('RGB') \
      .crop((0, 0, 800, 534)).save('cover.jpg', quality=95, optimize=True, \
      progressive=True, subsampling=0)"

  A PNG under 150 KB needs a 256-colour palette, which bands the gradients:
  hence JPEG. The previous cover was a screenshot that captured the browser's
  scrollbars.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 800px;
        height: 534px;
        overflow: hidden;
      }
      body {
        font-family: 'Inter', 'DejaVu Sans', sans-serif;
        background:
          radial-gradient(circle at 92% 8%, rgba(214, 120, 52, 0.55) 0, rgba(214, 120, 52, 0) 46%),
          radial-gradient(circle at 0% 100%, rgba(52, 96, 190, 0.45) 0, rgba(52, 96, 190, 0) 42%),
          linear-gradient(135deg, #141821 0%, #1b2030 55%, #241c1a 100%);
        color: #f3f1ec;
        position: relative;
      }
      .text {
        position: absolute;
        left: 64px;
        top: 140px;
        width: 410px;
      }
      .eyebrow {
        color: #e8873a;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 3px;
      }
      h1 {
        margin: 22px 0 0;
        font-size: 58px;
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .tagline {
        margin-top: 26px;
        font-size: 21px;
        line-height: 1.6;
        color: #b9bdc8;
      }

      /* An AV receiver front panel */
      .amp {
        position: absolute;
        left: 500px;
        top: 196px;
        width: 250px;
        height: 132px;
        border-radius: 14px;
        background: linear-gradient(180deg, #2a2f3b, #1d212b);
        border: 1px solid #3a4050;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .display {
        position: absolute;
        left: 74px;
        top: 20px;
        width: 102px;
        height: 34px;
        border-radius: 6px;
        background: #0d1118;
        border: 1px solid #2f3646;
        font-family: 'DejaVu Sans Mono', monospace;
        font-size: 11px;
        color: #7fd0ff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        line-height: 1.3;
      }
      .display .vol {
        color: #e8873a;
      }
      .knob {
        position: absolute;
        top: 22px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #3b4252, #1a1e27 70%);
        border: 3px solid #e8873a;
      }
      .knob::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 5px;
        width: 3px;
        height: 13px;
        margin-left: -1.5px;
        border-radius: 2px;
        background: #f3f1ec;
        transform-origin: 50% 20px;
      }
      .knob.left {
        left: 14px;
      }
      .knob.left::after {
        transform: rotate(-35deg);
      }
      .knob.right {
        right: 14px;
        border-color: #5b8de0;
      }
      .knob.right::after {
        transform: rotate(40deg);
      }
      .buttons {
        position: absolute;
        left: 74px;
        top: 66px;
        width: 102px;
        display: flex;
        justify-content: space-between;
      }
      .buttons span {
        width: 18px;
        height: 7px;
        border-radius: 4px;
        background: #3a4050;
      }
      .buttons span.on {
        background: #e8873a;
      }
      .feet {
        position: absolute;
        bottom: -9px;
        width: 26px;
        height: 8px;
        border-radius: 0 0 5px 5px;
        background: #12151c;
      }
      .feet.l {
        left: 22px;
      }
      .feet.r {
        right: 22px;
      }
      .led {
        position: absolute;
        left: 14px;
        bottom: 16px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5fd38a;
        box-shadow: 0 0 8px #5fd38a;
      }
      .brand {
        position: absolute;
        right: 16px;
        bottom: 12px;
        font-size: 10px;
        letter-spacing: 2px;
        color: #8a90a0;
      }

      /* Sound waves */
      .wave {
        position: absolute;
        border: 2px solid rgba(232, 135, 58, 0.35);
        border-left: none;
        border-bottom: none;
        border-top-color: transparent;
        border-radius: 50%;
      }
      .w1 {
        left: 742px;
        top: 236px;
        width: 30px;
        height: 52px;
        border-right-color: rgba(232, 135, 58, 0.55);
      }
      .w2 {
        left: 742px;
        top: 222px;
        width: 46px;
        height: 80px;
        border-right-color: rgba(232, 135, 58, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="eyebrow">GLADYS ASSISTANT</div>
      <h1>Denon /<br />Marantz AVR</h1>
      <div class="tagline">Power, volume, sources, widgets &amp; scenes for your AV receiver</div>
    </div>
    <div class="amp">
      <div class="knob left"></div>
      <div class="display">
        <div>NET · STEREO</div>
        <div class="vol">VOL 42</div>
      </div>
      <div class="buttons"><span class="on"></span><span></span><span></span><span></span></div>
      <div class="knob right"></div>
      <div class="led"></div>
      <div class="brand">AVR</div>
      <div class="feet l"></div>
      <div class="feet r"></div>
    </div>
    <div class="wave w1"></div>
    <div class="wave w2"></div>
  </body>
</html>
