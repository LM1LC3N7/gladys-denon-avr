# -----------------------------------------------------------------------------
# Dependabot: update pull requests, checked by the CI like any other.
#
#   - npm, monthly: the Gladys SDK first of all (new device categories and
#     features arrive through it); the development tools share one PR;
#   - GitHub Actions, monthly, all in one PR.
#
# Monthly rather than weekly: every update pull request runs the CI, and the
# GitHub Actions minutes are counted.
#
# The Docker base image is left out on purpose: `node:24-alpine` is a moving
# tag, pulled fresh by every release build (latest Node 24 and Alpine patches),
# and moving to the next Node major is a deliberate change (Dockerfile, CI
# matrix and `engines` together).
# -----------------------------------------------------------------------------
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
