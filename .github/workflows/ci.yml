# -----------------------------------------------------------------------------
# Continuous integration: runs on every push and every pull request.
#
# Four gates:
#   1. Prettier  -> consistent formatting (no style debates in reviews);
#   2. ESLint    -> catch real mistakes (undefined vars, dead code, ...);
#   3. Tests     -> `node --test`, the built-in runner (no network);
#   4. npm audit -> known vulnerabilities of the production dependencies.
#
# The GitHub Actions quota is limited: if every job fails in under 2 seconds,
# the quota is exhausted, it is not a bug.
#
# They run on Node 24, the version `engines` requires and the one the Docker
# image ships with (see the Dockerfile). The image is built too
# (amd64 only, never pushed), so a broken Dockerfile shows up here rather than
# in a release.
#
# The store validator (`npx github:GladysAssistant/integration-store .`) is not
# a gate here: it also checks that the manifest's `docker_image` exists on its
# registry, which is false until the first release.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Checks only read the code: no write scope for the token, whatever the
# repository default is.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false # no git push here

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Audit the production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false # no git push here

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build as build.yml, without pushing, and for amd64 only: emulating
      # arm64 is slow, and only the release build needs it.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
